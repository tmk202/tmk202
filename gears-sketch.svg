      <path class="gear-overlay" d="M 64.62,-9.60 L 73.69,-4.94 L 74.80,4.70 L 65.23,7.47 L 59.72,23.69 L 65.75,33.42 L 61.01,40.10 L 51.80,39.58 L 38.80,51.66 L 41.57,60.96 L 34.14,66.90 L 24.43,59.08 L 9.56,63.90 L 3.30,73.26 L -3.45,74.48 L -7.73,64.84 L -24.73,61.04 L -33.70,66.55 L -40.03,62.43 L -38.61,51.63 L -50.95,38.38 L -62.80,40.32 L -67.44,32.77 L -60.87,24.28 L -63.96,8.14 L -74.54,3.58 L -74.79,-3.23 L -63.93,-8.20 L -60.70,-24.26 L -67.24,-33.70 L -60.97,-40.49 L -51.31,-39.03 L -38.65,-50.78 L -41.47,-63.27 L -33.85,-66.98 L -25.51,-58.85 L -7.56,-64.73 L -3.91,-74.48 L 5.28,-74.33 L 7.90,-64.90 L 24.96,-60.48 L 33.61,-65.47 L 40.58,-62.82 L 40.67,-51.42 L 50.46,-40.56 L 61.21,-40.52 L 67.13,-33.60 L 58.86,-25.10 Z" />
      <circle class="gear-accent" cx="0" cy="0" r="45.2" />
      <circle class="center-dot" cx="0" cy="0" r="3.5" />
    </g>
  </g>

  <!-- Gear 2 (Counter-Clockwise) -->
  <g class="spin-ccw gear-group">
    <g transform="translate(195, 85)">
      <path class="gear-depth" d="M -32.13,25.64 L -42.90,26.08 L -46.27,17.93 L -38.34,10.62 L -38.34,-5.62 L -46.27,-12.93 L -42.90,-21.08 L -32.13,-20.64 L -20.64,-32.13 L -21.08,-42.90 L -12.93,-46.27 L -5.62,-38.34 L 10.62,-38.34 L 17.93,-46.27 L 26.08,-42.90 L 25.64,-32.13 L 37.13,-20.64 L 47.90,-21.08 L 51.27,-12.93 L 43.34,-5.62 L 43.34,10.62 L 51.27,17.93 L 47.90,26.08 L 37.13,25.64 L 25.64,37.13 L 26.08,47.90 L 17.93,51.27 L 10.62,43.34 L -5.62,43.34 L -12.93,51.27 L -21.08,47.90 L -20.64,37.13 Z" />
      <path class="gear-main" d="M -34.63,23.14 L -45.40,23.58 L -48.77,15.43 L -40.84,8.12 L -40.84,-8.12 L -48.77,-15.43 L -45.40,-23.58 L -34.63,-23.14 L -23.14,-34.63 L -23.58,-45.40 L -15.43,-48.77 L -8.12,-40.84 L 8.12,-40.84 L 15.43,-48.77 L 23.58,-45.40 L 23.14,-34.63 L 34.63,-23.14 L 45.40,-23.58 L 48.77,-15.43 L 40.84,-8.12 L 40.84,8.12 L 48.77,15.43 L 45.40,23.58 L 34.63,23.14 L 23.14,34.63 L 23.58,45.40 L 15.43,48.77 L 8.12,40.84 L -8.12,40.84 L -15.43,48.77 L -23.58,45.40 L -23.14,34.63 Z M 12.00,0 A 12.00 12.00 0 1 0 -12.00,0 A 12.00 12.00 0 1 0 12.00,0 Z M 31.41,6.94 A 5.50 5.50 0 1 0 20.41,6.94 A 5.50 5.50 0 1 0 31.41,6.94 Z M -1.44,25.91 A 5.50 5.50 0 1 0 -12.44,25.91 A 5.50 5.50 0 1 0 -1.44,25.91 Z M -20.41,-6.94 A 5.50 5.50 0 1 0 -31.41,-6.94 A 5.50 5.50 0 1 0 -20.41,-6.94 Z M 12.44,-25.91 A 5.50 5.50 0 1 0 1.44,-25.91 A 5.50 5.50 0 1 0 12.44,-25.91 Z" fill-rule="evenodd" />
      <path class="gear-overlay" d="M -34.87,22.39 L -44.43,23.88 L -48.71,15.90 L -40.00,8.57 L -41.72,-6.94 L -49.68,-16.29 L -46.18,-23.80 L -34.22,-24.00 L -23.94,-34.71 L -22.71,-46.45 L -14.46,-49.38 L -7.21,-41.52 L 9.13,-39.67 L 16.57,-48.42 L 24.67,-44.72 L 22.00,-34.63 L 34.33,-23.41 L 45.40,-23.60 L 48.49,-16.29 L 40.67,-8.58 L 41.69,6.97 L 47.89,15.56 L 44.40,23.07 L 35.12,24.28 L 22.81,33.48 L 23.50,45.06 L 15.01,49.07 L 7.86,40.48 L -7.68,40.89 L -15.25,48.38 L -23.64,45.71 L -22.03,35.34 Z" />
      <circle class="gear-accent" cx="0" cy="0" r="28.8" />
      <circle class="center-dot" cx="0" cy="0" r="3" />
    </g>
  </g>

  <!-- HEADER TEXT CONTENT -->
  <!-- Name -->
  <text x="535" y="48" text-anchor="middle" font-family="'Courier New', monospace" font-size="25" font-weight="800" fill="#ffffff" letter-spacing="2">🧑‍💻 NGUYEN NGOC TU</text>

  <!-- Subtitle -->
